[package]
name = "openfs-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openfs"
path = "src/main.rs"

[dependencies]
openfs-core = { path = "../openfs-core" }
openfs-block = { path = "../openfs-block" }
openfs-format = { path = "../openfs-format" }

[dev-dependencies]
openfs-core = { path = "../openfs-core" }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
dokan = "0.2"
widestring = "0.4"
winapi = { version = "0.3", features = ["fileapi", "winerror", "winnt"] }
