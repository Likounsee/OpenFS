name: OpenFS CI

on:
  push:
    branches: [OpenFS]
  pull_request:
  workflow_dispatch:

concurrency:
  group: openfs-ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S OpenFS -B build-${{ matrix.compiler }} -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-${{ matrix.compiler }} --parallel
      - name: Test
        run: |
          timeout 45s ./build-${{ matrix.compiler }}/openfs-path-test
          ctest --test-dir build-${{ matrix.compiler }} --output-on-failure --timeout 180
      - name: Sanitizers
        run: |
          cmake -S OpenFS -B build-${{ matrix.compiler }}-asan -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-${{ matrix.compiler }}-asan --parallel
          ctest --test-dir build-${{ matrix.compiler }}-asan --output-on-failure --timeout 180
      - name: Configure Release
        run: cmake -S OpenFS -B build-${{ matrix.compiler }}-release -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build-${{ matrix.compiler }}-release --parallel
      - name: Test Release
        run: |
          timeout 45s ./build-${{ matrix.compiler }}-release/openfs-path-test
          ctest --test-dir build-${{ matrix.compiler }}-release --output-on-failure --timeout 180

  windows:
    # Use the repository's Windows x64 self-hosted runner.
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
      - name: Configure
        run: cmake -S OpenFS -B build-windows -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-windows --config Debug --parallel
      - name: Test
        run: ctest --test-dir build-windows -C Debug --output-on-failure --timeout 180
      - name: Configure Release
        run: cmake -S OpenFS -B build-windows-release -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build-windows-release --config Release --parallel
      - name: Test Release
        run: ctest --test-dir build-windows-release -C Release --output-on-failure --timeout 180
