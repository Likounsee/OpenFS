name: Rust and native-format CI

# Prevent stale runs from occupying the limited GitHub-hosted runner queue.
concurrency:
  group: openfs-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [OpenFS]
  pull_request:
    branches: [OpenFS]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace (all features)
        run: cargo test --workspace --all-features
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace (all features)
        run: cargo test --workspace --all-features
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  native-superblock:
    name: Native superblock parser (host C tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile native parser tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSSuperblock.c OpenFSLayout.c OpenFSSuperblockTests.c -o openfs-superblock-tests
      - name: Run native parser tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-superblock-tests
      - name: Compile native bitmap tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSBitmap.c OpenFSBitmapTests.c -o openfs-bitmap-tests
      - name: Run native bitmap tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-bitmap-tests
      - name: Compile native volume layout tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSLayout.c OpenFSLayoutTests.c -o openfs-layout-tests
      - name: Run native volume layout tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-layout-tests

  windows-driver-wdk:
    name: Native Windows filesystem driver (WDK x64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install WDK build tools
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Add WDK tools to PATH
        shell: pwsh
        run: |
          $wdkRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'),
            (Join-Path $env:ProgramFiles 'Windows Kits\10')
          ) | Where-Object { Test-Path $_ }
          $stampInf = Get-ChildItem -Path $wdkRoots -Filter stampinf.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if ($null -eq $stampInf) {
            throw "The x64 WDK stampinf.exe was not found under the installed Windows Kits directories."
          }
          $toolDirectory = $stampInf.Directory.FullName
          Write-Host "Using x64 WDK tool directory: $toolDirectory"
          Add-Content -Path $env:GITHUB_PATH -Value $toolDirectory
      - name: Restore WDK packages and compile/link driver
        shell: pwsh
        run: |
          msbuild .\OpenFS\windows-driver\OpenFSDriver.vcxproj /m /restore /t:ClCompile,Link /p:Configuration=Debug /p:Platform=x64 /p:SignMode=Off
      - name: Publish unsigned development driver
        uses: actions/upload-artifact@v4
        with:
          name: openfs-wdk-x64-debug
          path: |
            OpenFS/windows-driver/bin/Debug/OpenFS.sys
            OpenFS/windows-driver/OpenFS.inf
          if-no-files-found: error
          retention-days: 7
