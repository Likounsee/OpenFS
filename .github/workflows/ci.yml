name: OpenFS CI

on:
  push:
    branches: [OpenFS]
  pull_request:
  workflow_dispatch:

concurrency:
  group: openfs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S OpenFS -B build-${{ matrix.compiler }} -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-${{ matrix.compiler }} --parallel
      - name: Test
        run: ctest --test-dir build-${{ matrix.compiler }} --output-on-failure
      - name: Sanitizers
        run: |
          cmake -S OpenFS -B build-${{ matrix.compiler }}-asan -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-${{ matrix.compiler }}-asan --parallel
          ctest --test-dir build-${{ matrix.compiler }}-asan --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S OpenFS -B build-windows -DOPENFS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-windows --config Debug --parallel
      - name: Test
        run: ctest --test-dir build-windows -C Debug --output-on-failure
      - name: Upload OpenFS image formatter
        uses: actions/upload-artifact@v4
        with:
          name: openfs-format-image-windows
          path: OpenFS/build-windows/adapters/Debug/openfs-format-image.exe
          if-no-files-found: error
