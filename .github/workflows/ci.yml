name: Rust CI

# Prevent stale runs from occupying the limited GitHub-hosted runner queue.
concurrency:
  group: openfs-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [OpenFS]
  pull_request:
    branches: [OpenFS]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
