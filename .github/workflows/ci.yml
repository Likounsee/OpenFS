name: Rust and native-format CI

# Prevent stale runs from occupying the limited GitHub-hosted runner queue.
concurrency:
  group: openfs-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [OpenFS]
  pull_request:
    branches: [OpenFS]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Rust checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace (all features)
        run: cargo test --workspace --all-features
      - name: Full crash-consistency sweep (release)
        run: cargo test --release -p openfs-format crash_sweep
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OpenFS
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace (all features)
        run: cargo test --workspace --all-features
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  native-superblock:
    name: Native superblock parser (host C tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile native parser tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSSuperblock.c OpenFSLayout.c OpenFSSuperblockTests.c -o openfs-superblock-tests
      - name: Run native parser tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-superblock-tests
      - name: Compile native bitmap tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSBitmap.c OpenFSBitmapTests.c -o openfs-bitmap-tests
      - name: Run native bitmap tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-bitmap-tests
      - name: Compile native volume layout tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSLayout.c OpenFSLayoutTests.c -o openfs-layout-tests
      - name: Run native volume layout tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-layout-tests
      - name: Compile native volume lifecycle tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror OpenFSVolumeState.c OpenFSVolumeStateTests.c -o openfs-volume-state-tests
      - name: Run native volume lifecycle tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-volume-state-tests
      - name: Compile native namespace codec tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSSuperblock.c OpenFSLayout.c OpenFSNamespace.c OpenFSNamespaceTests.c -o openfs-namespace-tests
      - name: Run native namespace codec tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-namespace-tests
      - name: Compile native extent-map decoder tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSSuperblock.c OpenFSLayout.c OpenFSExtentMap.c OpenFSExtentMapTests.c -o openfs-extent-map-tests
      - name: Run native extent-map decoder tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-extent-map-tests
      - name: Compile native inventory descriptor tests
        working-directory: OpenFS/windows-driver
        run: cc -std=c11 -Wall -Wextra -Werror -DOPENFS_HOST_TEST OpenFSSuperblock.c OpenFSLayout.c OpenFSInventory.c OpenFSInventoryTests.c -o openfs-inventory-tests
      - name: Run native inventory descriptor tests
        working-directory: OpenFS/windows-driver
        run: ./openfs-inventory-tests

  windows-driver-wdk:
    name: Native Windows filesystem driver (WDK x64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install WDK build tools
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements
      - name: Add WDK tools to PATH
        shell: pwsh
        run: |
          $wdkRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10'),
            (Join-Path $env:ProgramFiles 'Windows Kits\\10')
          ) | Where-Object { Test-Path $_ }
          $stampInf = Get-ChildItem -Path $wdkRoots -Filter stampinf.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Select-Object -First 1
          if ($null -eq $stampInf) {
            throw "The x64 WDK stampinf.exe was not found under the installed Windows Kits directories."
          }
          $toolDirectory = $stampInf.Directory.FullName
          Write-Host "Using x64 WDK tool directory: $toolDirectory"
          Add-Content -Path $env:GITHUB_PATH -Value $toolDirectory
      - name: Restore WDK packages and compile/link driver
        shell: pwsh
        run: |
          msbuild .\\OpenFS\\windows-driver\\OpenFSDriver.vcxproj /m /restore /t:ClCompile,Link /p:Configuration=Debug /p:Platform=x64 /p:SignMode=Off
      - name: Build unsigned driver package and catalog
        shell: pwsh
        run: |
          $wdkRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10'),
            (Join-Path $env:ProgramFiles 'Windows Kits\\10')
          ) | Where-Object { Test-Path $_ }
          $inf2cat = Get-ChildItem -Path $wdkRoots -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $inf2cat) {
            throw "Inf2Cat.exe was not found in the installed WDK."
          }

          $package = Join-Path $env:RUNNER_TEMP 'openfs-wdk-x64-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item '.\\OpenFS\\windows-driver\\bin\\Debug\\OpenFS.sys' $package
          Copy-Item '.\\OpenFS\\windows-driver\\OpenFS.inf' $package

          & $inf2cat.FullName "/driver:$package" /os:10_X64
          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path (Join-Path $package 'OpenFS.cat'))) {
            throw "Inf2Cat did not produce OpenFS.cat."
          }

          Get-ChildItem $package -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content (Join-Path $package 'SHA256SUMS.txt')
          Write-Host "Unsigned development package created at $package"
      - name: Publish unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: openfs-wdk-x64-unsigned-package
          path: ${{ runner.temp }}/openfs-wdk-x64-package/*
          if-no-files-found: error
          retention-days: 7
